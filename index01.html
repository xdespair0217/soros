<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CASSETTE DECK SYSTEM - MASTER CONSOLE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=M+PLUS+1p:wght@400;500;700&family=VT323&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #000000;
      --card-bg: rgba(22, 25, 32, 0.94);
      --card-border: #2b313d;
      --tape-sticker: #ded7be;
      --amber: #ffb800;
      --cyan: #38bdf8;
      --text-dim: #737c8e;
      --text-light: #e2e6ee;
      
      --font-jp: "Zen Kaku Gothic New", "M PLUS 1p", "Tahoma", sans-serif;
      --font-tech: "Chakra Petch", sans-serif;
      --font-lcd: "VT323", monospace;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: var(--font-jp); 
      -webkit-font-smoothing: antialiased; 
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      padding: 30px 24px 80px;
      overflow-x: hidden;
      position: relative;
    }

    /* Space Trip 星空畫布背景 */
    #starfield {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .stage-container {
      position: relative;
      z-index: 10;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ===== 機架主控台 ===== */
    .master-rack-deck {
      width: 100%;
      background: linear-gradient(180deg, #1b202a 0%, #101217 100%);
      border: 1px solid #333d4e;
      border-top: 2px solid #4f5d75;
      border-radius: 8px;
      padding: 10px 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .rack-bolt {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #0d0f12;
      border: 1px solid #3d4656;
      position: relative;
    }
    .rack-bolt::after {
      content: ""; position: absolute; top: 4px; left: 1px; width: 6px; height: 1px; background: #55627a;
    }

    .deck-core-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .deck-select {
      background: #0c0e12;
      border: 1px solid #283140;
      color: var(--amber);
      font-family: var(--font-tech);
      font-weight: 600;
      font-size: 0.88rem;
      padding: 6px 12px;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      min-width: 180px;
      letter-spacing: 0.05em;
    }

    .deck-keys { display: flex; gap: 6px; }

    .ctrl-btn {
      width: 32px; height: 32px;
      background: linear-gradient(180deg, #2f3747 0%, #1a202c 100%);
      border: 1px solid #141720;
      border-top: 1px solid #4a566d;
      color: #e5e7eb;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.8rem;
      font-family: var(--font-tech);
      font-weight: 700;
      user-select: none;
    }
    .ctrl-btn:active { transform: translateY(1px); }
    .ctrl-btn.active {
      background: rgba(255, 184, 0, 0.15);
      border-color: var(--amber);
      color: var(--amber);
      box-shadow: 0 0 8px rgba(255, 184, 0, 0.4);
    }

    .deck-core-center {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      justify-content: center;
    }

    .lcd-display {
      font-family: var(--font-lcd);
      color: var(--amber);
      font-size: 1.85rem;
      letter-spacing: 2px;
      line-height: 1;
      min-width: 70px;
      text-align: center;
      text-shadow: 0 0 10px rgba(255, 184, 0, 0.4);
      background: #080a0d;
      padding: 3px 6px;
      border-radius: 4px;
      border: 1px solid #231f0e;
    }

    .eq-spectrum {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 22px;
      padding: 0 5px;
      background: #090a0d;
      border: 1px solid #1f2530;
      border-radius: 3px;
    }
    .eq-col {
      width: 4px; height: 4px; border-radius: 1px;
      transition: height 0.08s ease;
    }
    .eq-col.cyan { background-color: var(--cyan); box-shadow: 0 0 5px rgba(56, 189, 248, 0.5); }
    .eq-col.amber { background-color: var(--amber); box-shadow: 0 0 5px rgba(255, 184, 0, 0.5); }

    .deck-core-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      justify-content: flex-end;
    }

    .track-subtitle-box {
      flex: 1;
      position: relative;
      padding-bottom: 3px;
      overflow: hidden;
    }
    .track-subtitle {
      font-family: var(--font-jp);
      font-size: 0.82rem;
      font-weight: 500;
      color: #9cb3cc;
      letter-spacing: 0.06em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }
    .track-subtitle-box::after {
      content: "";
      position: absolute; left: 0; bottom: 0; width: 100%; height: 1px;
      background: linear-gradient(90deg, #333d4d 0%, #1e242e 90%, transparent 100%);
    }

    .volume-ctrl-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0a0c10;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #202633;
    }
    .vol-icon { font-size: 0.7rem; color: #737c8e; font-family: var(--font-tech); }
    .vol-slider {
      -webkit-appearance: none;
      width: 65px; height: 3px;
      background: #252b36; border-radius: 2px; outline: none;
    }
    .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 8px; height: 8px; border-radius: 50%; background: var(--amber);
    }

    /* ===== 次級副面板 ===== */
    .sub-control-panel {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 14px;
      background: rgba(14, 16, 21, 0.75);
      border: 1px solid #222733;
      border-radius: 5px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 2px;
    }
    .filter-label {
      font-family: var(--font-tech);
      font-size: 0.75rem;
      color: var(--text-dim);
      font-weight: 600;
      letter-spacing: 0.1em;
    }
    .filter-btn {
      background: rgba(22, 25, 33, 0.9);
      border: 1px solid #2d3340;
      color: #8c93a4;
      padding: 4px 12px;
      font-size: 0.8rem;
      border-radius: 3px;
      cursor: pointer;
    }
    .filter-btn.active {
      background: rgba(255, 184, 0, 0.15);
      border-color: var(--amber);
      color: var(--amber);
      font-weight: 700;
    }

    .admin-group button {
      background: #181b22;
      color: #c4c9d4;
      border: 1px solid #2c3240;
      padding: 4px 10px;
      margin-left: 5px;
      cursor: pointer;
      font-family: var(--font-tech);
      font-size: 0.75rem;
      border-radius: 3px;
    }
    .admin-group button.active { background: #ff5533; color: #0c0e12; font-weight: 700; }

    /* ===== 卡帶網格展示區 ===== */
    .cassette-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
    }

    .cassette-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 2px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .cassette-card:hover {
      transform: translateY(-4px);
      border-color: #485368;
    }
    .cassette-card.is-hidden { display: none; }

    .label-sticker {
      background: var(--tape-sticker);
      color: #1a1a1a;
      padding: 8px 10px;
      border-radius: 4px;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .card-title {
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-artist {
      font-size: 0.74rem; font-weight: 500; opacity: 0.85;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .tape-window {
      position: relative;
      height: 140px;
      background: #08080a;
      border: 1px solid #1f232c;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
    }
    .cover-image { width: 100%; height: 100%; object-fit: cover; opacity: 0.92; }

    .card-bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-actions { display: flex; gap: 6px; flex: 1; }
    .card-btn {
      flex: 1;
      background: #13161c;
      color: #aaa;
      border: 1px solid #2d323d;
      padding: 6px 0;
      cursor: pointer;
      font-family: var(--font-tech);
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 2px;
    }
    .card-btn:hover { color: #fff; border-color: #555; }

    .mini-reel-window {
      width: 50px; height: 24px;
      background: #090a0d;
      border: 1px solid #1f232b;
      border-radius: 3px;
      display: flex; align-items: center; justify-content: space-around;
      padding: 0 4px;
    }
    .gear {
      width: 13px; height: 13px;
      border: 2px dashed #555; border-radius: 50%; background: #14161a;
    }
    .playing .gear { animation: spin 2.5s linear infinite; border-color: var(--amber); }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .edit-panel {
      display: none;
      flex-direction: column;
      gap: 5px;
      font-size: 0.72rem;
      border-top: 1px solid #333;
      padding-top: 6px;
    }
    .editing .edit-panel { display: flex; }
    .edit-panel label { font-family: var(--font-tech); font-size: 0.7rem; color: #888; }
    .edit-panel input, .edit-panel textarea {
      background: #0e1014;
      border: 1px solid #333d4e;
      color: #eee;
      padding: 4px;
      font-size: 0.75rem;
    }

    /* 燈箱 Modal */
    .lightbox-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(14px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 16px;
    }
    .lightbox-backdrop.active { opacity: 1; pointer-events: auto; }

    .lightbox-modal {
      width: 100%;
      max-width: 680px;
      background: #14171d;
      border: 2px solid #323846;
      border-radius: 8px;
      overflow: hidden;
      transform: scale(0.92);
      transition: transform 0.25s ease;
      display: flex;
      flex-direction: column;
      max-height: 85vh;
    }
    .lightbox-backdrop.active .lightbox-modal { transform: scale(1); }

    .lightbox-header {
      height: 40px;
      background: #1a1e27;
      border-bottom: 1px solid #2c3240;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .lightbox-tag { font-family: var(--font-tech); font-size: 0.75rem; color: var(--amber); font-weight: 700; }
    .lightbox-close { background: transparent; border: none; color: #aaa; font-size: 1.2rem; cursor: pointer; }

    .lightbox-body {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 20px;
      padding: 20px;
      overflow-y: auto;
    }
    .lightbox-cover {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #282f3d;
    }
    .lightbox-meta-box {
      font-family: var(--font-tech);
      font-size: 0.72rem;
      color: #737c8e;
      line-height: 1.6;
      border-left: 2px solid #282f3d;
      padding-left: 10px;
      margin-top: 10px;
    }
    .lightbox-title { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .lightbox-artist { font-size: 0.88rem; color: var(--amber); margin-top: 4px; }
    .lightbox-notes-content {
      font-size: 0.85rem;
      line-height: 1.8;
      color: #a8b3c4;
      white-space: pre-wrap;
      background: #0d0f13;
      padding: 14px;
      border-radius: 4px;
      border: 1px solid #1e222b;
      margin-top: 12px;
      max-height: 240px;
      overflow-y: auto;
    }

    /* 手機端 RWD 適配 */
    @media (max-width: 768px) {
      body { padding: 14px 12px 60px; }
      .admin-group, .edit-panel { display: none !important; }
      .rack-bolt { display: none; }

      .master-rack-deck { padding: 10px 12px; gap: 10px; }
      .deck-core-left { width: 100%; justify-content: space-between; }
      .deck-select { flex: 1; min-width: 0; font-size: 0.82rem; }
      .deck-core-center { width: 100%; justify-content: space-between; }
      .deck-core-right { width: 100%; justify-content: space-between; }
      .volume-ctrl-box { display: none; }
      .track-subtitle-box { width: 100%; }

      .cassette-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 14px;
      }
      .tape-window { height: 110px; }
      .mini-reel-window { display: none; }
      .card-title { font-size: 0.82rem; }
      .card-artist { font-size: 0.7rem; }

      .lightbox-body { grid-template-columns: 1fr; padding: 16px; gap: 14px; }
      .lightbox-cover { height: 180px; }
      .lightbox-meta-box { display: none; }
    }
  </style>
</head>
<body>

  <canvas id="starfield"></canvas>

  <div class="stage-container">
    <!-- 主機架控制艙 -->
    <header class="master-rack-deck">
      <div class="rack-bolt"></div>

      <div class="deck-core-left">
        <select class="deck-select" id="trackSelect" onchange="selectTrack(this.value)">
          <option value="" disabled selected>-- 選擇曲目 --</option>
        </select>

        <div class="deck-keys">
          <button class="ctrl-btn" id="playBtn" onclick="togglePlay()" title="播放/暫停">❚❚</button>
          <button class="ctrl-btn" onclick="stopMusic()" title="停止">■</button>
          <button class="ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()" title="隨機播放">🔀</button>
        </div>
      </div>

      <div class="deck-core-center">
        <div class="lcd-display" id="lcdTimer">00:00</div>

        <div class="eq-spectrum" id="eqSpectrum">
          <div class="eq-col cyan" style="height: 14px;"></div>
          <div class="eq-col cyan" style="height: 8px;"></div>
          <div class="eq-col cyan" style="height: 18px;"></div>
          <div class="eq-col cyan" style="height: 10px;"></div>
          <div class="eq-col cyan" style="height: 16px;"></div>
          <div class="eq-col cyan" style="height: 12px;"></div>
          <div class="eq-col cyan" style="height: 20px;"></div>
          <div class="eq-col cyan" style="height: 14px;"></div>
          <div class="eq-col amber" style="height: 18px;"></div>
          <div class="eq-col amber" style="height: 12px;"></div>
          <div class="eq-col amber" style="height: 6px;"></div>
          <div class="eq-col amber" style="height: 16px;"></div>
        </div>
      </div>

      <div class="deck-core-right">
        <div class="track-subtitle-box">
          <span class="track-subtitle" id="trackSubtitle">負けないで (ZARD / 坂井泉水)</span>
        </div>

        <div class="volume-ctrl-box">
          <span class="vol-icon">VOL</span>
          <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="80" oninput="changeVolume(this.value)">
        </div>
      </div>

      <div class="rack-bolt"></div>
    </header>

    <!-- 分類與管理欄 -->
    <div class="sub-control-panel">
      <div class="filter-group" id="filterBar">
        <span class="filter-label">ARTIST:</span>
        <button class="filter-btn active" onclick="setFilter('ALL')">ALL 全部</button>
      </div>
      <div class="admin-group">
        <button id="addCardBtn">+ 新增</button>
        <button id="toggleEditBtn">EDIT 模式</button>
        <button id="exportBtn">匯出 JSON</button>
        <button onclick="document.getElementById('importFile').click()">匯入 JSON</button>
        <input type="file" id="importFile" accept=".json" style="display:none;">
      </div>
    </div>

    <!-- 卡帶展示網格 -->
    <main class="cassette-grid" id="gridContainer"></main>
  </div>

  <!-- Zooming 燈箱 -->
  <div class="lightbox-backdrop" id="lightboxBackdrop" onclick="closeLightbox(event)">
    <div class="lightbox-modal">
      <div class="lightbox-header">
        <span class="lightbox-tag" id="lbTag">CASSETTE ARCHIVE // TAPE DECK</span>
        <button class="lightbox-close" onclick="closeLightboxDirect()">✕</button>
      </div>
      <div class="lightbox-body">
        <div>
          <img class="lightbox-cover" id="lbCover" src="" alt="Album Cover">
          <div class="lightbox-meta-box">
            <div>STATUS: LOADED</div>
            <div>STREAM: HI-RES 44.1kHz</div>
            <div>DECK REF: BLACK BOX 1980s</div>
          </div>
        </div>
        <div>
          <div class="lightbox-title" id="lbTitle">曲名</div>
          <div class="lightbox-artist" id="lbArtist">歌手</div>
          <div class="lightbox-notes-content" id="lbNotes">筆記與歌詞內容</div>
        </div>
      </div>
    </div>
  </div>

  <audio id="globalAudio" style="display:none;"></audio>

  <script>
    /* ===== Space Trip 橫移星空運算 ===== */
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const starPalette = ["#abbbff", "#ffffee", "#ffff7a", "#dffffd", "#ffaaa0", "#ffddd0"];
    const stars = [];

    for (let i = 0; i < 40; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: 1,
        speed: Math.random() * 1.5 + 0.5,
        color: starPalette[Math.floor(Math.random() * starPalette.length)]
      });
    }
    for (let i = 0; i < 18; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: 2,
        speed: Math.random() * 2.8 + 1.2,
        color: starPalette[Math.floor(Math.random() * starPalette.length)]
      });
    }

    function renderStars() {
      ctx.clearRect(0, 0, width, height);
      for (let star of stars) {
        star.x -= star.speed;
        if (star.x < -5) star.x = width + 5;
        ctx.fillStyle = star.color;
        ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
      }
      requestAnimationFrame(renderStars);
    }
    renderStars();

    /* ===== 音訊管理與雙軌持久化核心 ===== */
    const STORAGE_KEY = "BLACKBOX_CASSETTE_DATA_V1";
    const REMOTE_JSON_URL = "./cassette_tape_data.json"; // 雲端同目錄下的 JSON 檔案名稱

    let isEditing = false;
    let isShuffle = false;
    let currentFilter = 'ALL';
    let currentTrackIndex = 0;
    let eqInterval = null;

    // 預設清單（若本機與雲端都沒有資料時啟動）
    let defaultMusicList = [
      {
        id: 1788443714852,
        title: "負けないで",
        artist: "ZARD",
        subtitle: "負けないで (ZARD / 坂井泉水)",
        audioUrl: "https://www.image2url.com/r2/default/audio/1788443714852-c2a78ad9-9fe1-4d1f-b615-c71f6871d33c.mp3",
        coverUrl: "https://picsum.photos/600/400?grayscale&random=93",
        notes: "負けないで もう少し\n最後まで 走り抜けて\nどんなに 離れてても\n心は そばにいるわ\n追いかけて 遙かな夢を..."
      },
      {
        id: 1788443714853,
        title: "突然",
        artist: "ZARD",
        subtitle: "突然 (ZARD / 坂井泉水)",
        audioUrl: "",
        coverUrl: "https://picsum.photos/600/400?grayscale&random=94",
        notes: "突然の風に吹かれて 夢中で駆け抜けた\nいつも僕のそばに君がいて\nあの日の約束は 今も胸の奥にある\nめぐる季節を越えて..."
      },
      {
        id: 1788443714854,
        title: "きっと忘れない",
        artist: "ZARD",
        subtitle: "きっと忘れない (ZARD / 坂井泉水)",
        audioUrl: "",
        coverUrl: "https://picsum.photos/600/400?grayscale&random=95",
        notes: "きっと忘れない 眩しい笑顔で\nWash away, 洗い流して\n遠く離れても 心はいつも\nあなたのそばにいるから..."
      }
    ];

    let musicList = [];

    const gridContainer = document.getElementById('gridContainer');
    const filterBar = document.getElementById('filterBar');
    const trackSelect = document.getElementById('trackSelect');
    const audio = document.getElementById('globalAudio');
    const lcdTimer = document.getElementById('lcdTimer');
    const playBtn = document.getElementById('playBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const trackSubtitle = document.getElementById('trackSubtitle');
    const eqCols = document.querySelectorAll('.eq-col');

    audio.volume = 0.8;

    // 自動持久化：寫入 localStorage
    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(musicList));
      } catch(e) {
        console.warn("無法存入本地快取", e);
      }
    }

    // 雙軌載入程序
    async function init() {
      const localData = localStorage.getItem(STORAGE_KEY);
      
      if (localData) {
        try {
          musicList = JSON.parse(localData);
        } catch(e) {
          musicList = defaultMusicList;
        }
      } else {
        // 本機無快照，嘗試自伺服器抓取 JSON
        try {
          const resp = await fetch(REMOTE_JSON_URL);
          if (resp.ok) {
            musicList = await resp.json();
            saveToStorage();
          } else {
            musicList = defaultMusicList;
          }
        } catch(err) {
          musicList = defaultMusicList;
        }
      }

      renderFilters();
      renderSelector();
      renderCards();
      if (musicList.length > 0) {
        trackSelect.value = 0;
        trackSubtitle.innerText = musicList[0].subtitle || musicList[0].title;
      }
    }

    function renderFilters() {
      const artists = ['ALL', ...new Set(musicList.map(item => item.artist).filter(Boolean))];
      filterBar.innerHTML = '<span class="filter-label">ARTIST:</span>';
      artists.forEach(artist => {
        const btn = document.createElement('button');
        btn.className = `filter-btn ${currentFilter === artist ? 'active' : ''}`;
        btn.innerText = artist;
        btn.onclick = () => setFilter(artist);
        filterBar.appendChild(btn);
      });
    }

    function setFilter(artist) {
      currentFilter = artist;
      renderFilters();
      renderCards();
    }

    function renderSelector() {
      trackSelect.innerHTML = '<option value="" disabled selected>-- 選擇曲目 --</option>';
      musicList.forEach((item, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.innerText = `[${item.artist}] ${item.title}`;
        trackSelect.appendChild(opt);
      });
    }

    function renderCards() {
      gridContainer.innerHTML = '';
      musicList.forEach((item, index) => {
        const isVisible = currentFilter === 'ALL' || item.artist === currentFilter;
        const card = document.createElement('div');
        card.className = `cassette-card ${isEditing ? 'editing' : ''} ${!isVisible ? 'is-hidden' : ''}`;
        card.dataset.index = index;

        card.innerHTML = `
          <div class="label-sticker">
            <div class="card-title">${item.title}</div>
            <div class="card-artist">${item.artist}</div>
          </div>
          <div class="tape-window" onclick="handleCoverClick(${index})">
            <img class="cover-image" src="${item.coverUrl}" alt="Cover">
            <input type="file" class="file-input-${index}" accept="image/*" style="display:none;" onchange="handleImage(event, ${index})">
          </div>
          <div class="card-bottom-bar">
            <div class="card-actions">
              <button class="card-btn" onclick="playIndex(${index})">PLAY</button>
              <button class="card-btn" onclick="openLightbox(${index})">NOTE</button>
              ${isEditing ? `<button class="card-btn" style="color:#ff5533;" onclick="deleteCard(${index})">DEL</button>` : ''}
            </div>
            <div class="mini-reel-window">
              <div class="gear"></div>
              <div class="gear"></div>
            </div>
          </div>
          <div class="edit-panel">
            <label>曲名：</label>
            <input type="text" value="${item.title}" onchange="updateTrackData(${index}, 'title', this.value)">
            <label>歌手分類：</label>
            <input type="text" value="${item.artist}" onchange="updateTrackData(${index}, 'artist', this.value)">
            <label>標註：</label>
            <input type="text" value="${item.subtitle || ''}" onchange="updateTrackData(${index}, 'subtitle', this.value)">
            <label>MP3 網址：</label>
            <input type="text" value="${item.audioUrl}" onchange="updateTrackData(${index}, 'audioUrl', this.value)">
            <label>筆記：</label>
            <textarea rows="2" onchange="updateTrackData(${index}, 'notes', this.value)">${item.notes || ''}</textarea>
          </div>
        `;
        gridContainer.appendChild(card);
      });
    }

    function updateTrackData(index, field, value) {
      musicList[index][field] = value;
      saveToStorage();
      if (field === 'artist') renderFilters();
      if (field === 'title' || field === 'artist') renderSelector();
    }

    function handleCoverClick(index) {
      if (isEditing && window.innerWidth > 768) {
        document.querySelector(`.file-input-${index}`).click();
      } else {
        openLightbox(index);
      }
    }

    function openLightbox(index) {
      const item = musicList[index];
      document.getElementById('lbCover').src = item.coverUrl;
      document.getElementById('lbTitle').innerText = item.title;
      document.getElementById('lbArtist').innerText = item.artist;
      document.getElementById('lbNotes').innerText = item.notes || "（暫無歌詞與筆記內容）";
      document.getElementById('lbTag').innerText = `CASSETTE ARCHIVE // [0${index + 1}]`;
      document.getElementById('lightboxBackdrop').classList.add('active');
    }

    function closeLightbox(e) {
      if (e.target.id === 'lightboxBackdrop') {
        document.getElementById('lightboxBackdrop').classList.remove('active');
      }
    }
    function closeLightboxDirect() {
      document.getElementById('lightboxBackdrop').classList.remove('active');
    }

    function playIndex(index) {
      currentTrackIndex = index;
      const item = musicList[index];
      if (!item.audioUrl) return alert("請輸入此曲目的 MP3 音訊網址！");

      document.querySelectorAll('.cassette-card').forEach(c => c.classList.remove('playing'));
      if (gridContainer.children[index]) gridContainer.children[index].classList.add('playing');

      trackSelect.value = index;
      trackSubtitle.innerText = item.subtitle || `${item.title} (${item.artist})`;
      audio.src = item.audioUrl;
      audio.play();
      playBtn.innerText = '❚❚';
      startEqualizer();
    }

    function togglePlay() {
      if (!audio.src) {
        if (musicList.length > 0) playIndex(0);
        return;
      }
      if (audio.paused) {
        audio.play();
        playBtn.innerText = '❚❚';
        startEqualizer();
      } else {
        audio.pause();
        playBtn.innerText = '▶';
        stopEqualizer();
      }
    }

    function stopMusic() {
      audio.pause();
      audio.currentTime = 0;
      playBtn.innerText = '▶';
      lcdTimer.innerText = "00:00";
      stopEqualizer();
      document.querySelectorAll('.cassette-card').forEach(c => c.classList.remove('playing'));
    }

    function selectTrack(idx) {
      if (idx !== "") playIndex(parseInt(idx));
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle('active', isShuffle);
    }

    function changeVolume(val) {
      audio.volume = val / 100;
    }

    audio.onended = () => {
      if (musicList.length === 0) return;
      if (isShuffle) {
        let randIndex;
        do {
          randIndex = Math.floor(Math.random() * musicList.length);
        } while (musicList.length > 1 && randIndex === currentTrackIndex);
        playIndex(randIndex);
      } else {
        let nextIndex = (currentTrackIndex + 1) % musicList.length;
        playIndex(nextIndex);
      }
    };

    audio.ontimeupdate = () => {
      const sec = Math.floor(audio.currentTime);
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      lcdTimer.innerText = `${m}:${s}`;
    };

    function startEqualizer() {
      if (eqInterval) clearInterval(eqInterval);
      eqInterval = setInterval(() => {
        eqCols.forEach(col => {
          const randHeight = Math.floor(Math.random() * 18) + 4;
          col.style.height = `${randHeight}px`;
        });
      }, 90);
    }

    function stopEqualizer() {
      clearInterval(eqInterval);
      eqCols.forEach(col => col.style.height = '4px');
    }

    function handleImage(e, index) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        musicList[index].coverUrl = evt.target.result;
        saveToStorage();
        renderCards();
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('toggleEditBtn').onclick = () => {
      isEditing = !isEditing;
      document.getElementById('toggleEditBtn').innerText = `EDIT 模式: ${isEditing ? '開' : '關'}`;
      document.getElementById('toggleEditBtn').classList.toggle('active', isEditing);
      if (!isEditing) saveToStorage();
      renderCards();
    };

    document.getElementById('addCardBtn').onclick = () => {
      musicList.push({
        id: Date.now(),
        title: "未命名曲目.mp3",
        artist: "自訂歌手",
        subtitle: "未命名曲目 (新標籤)",
        audioUrl: "",
        coverUrl: "https://picsum.photos/600/400",
        notes: ""
      });
      saveToStorage();
      renderFilters();
      renderSelector();
      renderCards();
    };

    function deleteCard(index) {
      musicList.splice(index, 1);
      saveToStorage();
      renderFilters();
      renderSelector();
      renderCards();
    }

    // 打包匯出 JSON 檔案
    document.getElementById('exportBtn').onclick = () => {
      const blob = new Blob([JSON.stringify(musicList, null, 2)], {type: "application/json"});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = "cassette_tape_data.json";
      a.click();
    };

    // 匯入 JSON 並立即寫入瀏覽器本地快照
    document.getElementById('importFile').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          musicList = JSON.parse(evt.target.result);
          saveToStorage(); // 立即永久保存
          currentFilter = 'ALL';
          renderFilters();
          renderSelector();
          renderCards();
          alert("資料庫已成功載入並同步至瀏覽器快取！");
        } catch(err) { alert("JSON 格式錯誤"); }
      };
      reader.readAsText(file);
    };

    init();
  </script>
</body>
</html>
